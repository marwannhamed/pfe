# The whole platform in one command:
#
#   docker compose up -d --build
#
#   app      http://localhost:5173    (nginx: the UI, and the API on one origin)
#   swagger  http://localhost:5173/api
#   adminer  http://localhost:8081
#
# backend/docker-compose.yaml still exists for working on the API alone. Run
# one or the other — both bind 5433, 6001 and 8081, so they collide.
name: leasemanager

services:
  postgres:
    image: postgres:13.5
    restart: always
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lease_management']
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    restart: always
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Published so Swagger, the seed scripts and npm run audit:access can reach
    # it directly; the browser does not need it — nginx proxies /auth, /bookings
    # and the rest from the same origin as the UI.
    ports:
      - '6001:6001'
    env_file:
      - backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lease_management?schema=public
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      # Keeps the image's Linux install: the host's node_modules carries
      # query_engine-windows.dll.node, which this container cannot load.
      - /app/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:6001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    # 5173 keeps the address the team already knows from the Vite dev server.
    ports:
      - '5173:80'

volumes:
  postgres_data:
    # Reuses the volume backend/docker-compose.yaml already created, so the
    # existing database — migrations, seed and any manual edits — carries over
    # instead of this stack starting on an empty one under its own name.
    external: true
    name: backend_postgres_data
