version: '3.8'

services:
  postgres:
    image: postgres:13.5
    restart: always
    env_file:
      - .env
    volumes:
      # Use a named volume for persistence
      - postgres_data:/var/lib/postgresql/data   
    ports:
      - '5433:5432'

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    depends_on:
      - postgres
    ports:
      - '6001:6001'
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lease_management?schema=public
    volumes:
      - .:/app

volumes:
  # Define the named volume for PostgreSQL data persistence
  postgres_data:   
