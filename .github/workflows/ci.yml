name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test:cov --if-present

      - name: Build
        run: npm run build --if-present

  frontend:
    name: Frontend - Lint, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # tsconfig.json is a solution file ("files": [] + references), so
      # `tsc --noEmit` type-checks nothing and always passes. `tsc -b` walks
      # the referenced projects and actually checks the source.
      - name: Type check
        run: npx tsc -b --force

      - name: Test coverage
        run: npm run test:coverage --if-present

      - name: Build
        run: npm run build --if-present

  security-audit:
    name: Security - Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend
          - frontend
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reports but does not block. The frontend is clean at this level. The
      # backend is down to three high advisories after the Nest 11 upgrade,
      # all of them in multer by way of @nestjs/platform-express, with no fix
      # published upstream — `npm audit fix` cannot move them. Drop
      # continue-on-error once a fixed platform-express lands, so regressions
      # fail the build again.
      - name: Run npm audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true
