<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="811px" preserveAspectRatio="none" style="width:713px;height:811px;background:#FFFFFF;" version="1.1" viewBox="0 0 713 811" width="713px" zoomAndPan="magnify"><title>State machine diagram &#8212; Invoice</title><defs/><g><text fill="#1F3A5F" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="287.0947" x="206.3979" y="28.8838">State machine diagram &#8212; Invoice</text><!--cluster OUT--><g id="cluster_OUT"><path d="M12,271.6982 L375,271.6982 A5,5 0 0 1 380,276.6982 L380,294.4971 L7,294.4971 L7,276.6982 A5,5 0 0 1 12,271.6982 " fill="#EAF2FB" style="stroke:#EAF2FB;stroke-width:1.0;"/><rect fill="none" height="534" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="373" x="7" y="271.6982"/><line style="stroke:#2E5C8A;stroke-width:1.3;" x1="7" x2="380" y1="294.4971" y2="294.4971"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.7109" x="161.5" y="288.9541">Outstanding</text></g><rect fill="#EAF2FB" height="40" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="53.9961" x="56" y="315.6982"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="39.9961" x="63" y="340.0547">DRAFT</text><rect fill="#EAF2FB" height="40" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="58.6777" x="224.5" y="315.6982"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="44.6777" x="231.5" y="340.0547">ISSUED</text><g id="OUT.SENT"><rect fill="#EAF2FB" height="55.5977" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="154.0547" x="101" y="442.6982"/><line style="stroke:#2E5C8A;stroke-width:1.3;" x1="101" x2="255.0547" y1="470.4971" y2="470.4971"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.0039" x="162.0254" y="460.9541">SENT</text><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0547" x="108" y="488.7529">entry / e-mail the invoice</text></g><rect fill="#EAF2FB" height="40" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="113.375" x="31.5" y="585.6982"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="99.375" x="38.5" y="610.0547">PARTIALLY_PAID</text><g id="OUT.OVERDUE"><rect fill="#EAF2FB" height="69.3965" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="206.0977" x="142" y="712.6982"/><line style="stroke:#2E5C8A;stroke-width:1.3;" x1="142" x2="348.0977" y1="740.4971" y2="740.4971"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.3438" x="215.377" y="730.9541">OVERDUE</text><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.0977" x="149" y="758.7529">entry / reminders 1, 7 and 14 days</text><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.7754" x="149" y="772.5518">after the due date (08:00 job)</text></g><g id="elem_c"><polygon fill="#FBEBC8" points="171,177.6982,183,189.6982,171,201.6982,159,189.6982,171,177.6982" style="stroke:#B07D1A;stroke-width:1.3;"/></g><ellipse cx="171" cy="86.1982" fill="#1F3A5F" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#EAF2FB" height="40" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="50" x="405" y="450.6982"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.0078" x="415.9961" y="475.0547">PAID</text><rect fill="#EAF2FB" height="40" rx="5" ry="5" style="stroke:#2E5C8A;stroke-width:1.3;" width="86.0234" x="560" y="450.6982"/><text fill="#1B2631" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.0234" x="567" y="475.0547">CANCELLED</text><ellipse cx="531" cy="605.6982" fill="none" rx="11" ry="11" style="stroke:#1F3A5F;stroke-width:1.0;"/><ellipse cx="531" cy="605.6982" fill="#222222" rx="6" ry="6" style="stroke:#1F3A5F;stroke-width:1.0;"/><g id="elem_N1"><path d="M236,56.6982 L236,115.8936 A5,5 0 0 0 241,120.8936 L624.9648,120.8936 A5,5 0 0 0 629.9648,115.8936 L629.9648,61.6982 L619.9648,51.6982 L241,51.6982 A5,5 0 0 0 236,56.6982 " fill="#FFF9E3" style="stroke:#C9A63C;stroke-width:0.5;"/><path d="M619.9648,51.6982 L619.9648,59.1982 A2.5,2.5 0 0 0 622.4648,61.6982 L629.9648,61.6982 L619.9648,51.6982 " fill="#FFF9E3" style="stroke:#C9A63C;stroke-width:1.0;"/><text fill="#3D3420" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="368.9648" x="244" y="69.9541">"paid" is the sum of the invoice's COMPLETED payments. A payment</text><text fill="#3D3420" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="362.8184" x="247.0732" y="83.7529">becomes COMPLETED when finance records it, or confirms one the</text><text fill="#3D3420" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="362.1914" x="247.3867" y="97.5518">renter reported. The daily check and partial payments apply to every</text><text fill="#3D3420" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.1387" x="292.4131" y="111.3506">outstanding invoice, DRAFT and ISSUED included.</text></g><!--link *start* to c--><g id="link_*start*_c"><path d="M171,96.2082 C171,114.7382 171,151.1082 171,171.4182 " fill="none" id="*start*-to-c" style="stroke:#3E5470;stroke-width:1.3;"/><polygon fill="#3E5470" points="171,177.4182,175,168.4182,171,172.4182,167,168.4182,171,177.4182" style="stroke:#3E5470;stroke-width:1.3;"/></g><!--link c to ISSUED--><g id="link_c_ISSUED"><path d="M176.61,196.1082 C183.83,203.2882 196.48,216.5982 205,229.6982 C223.32,257.8582 236.424,288.3628 244.824,310.0628 " fill="none" id="c-to-ISSUED" style="stroke:#3E5470;stroke-width:1.3;"/><polygon fill="#3E5470" points="246.99,315.6582,247.4713,305.8212,245.185,310.9954,240.0108,308.7091,246.99,315.6582" style="stroke:#3E5470;stroke-width:1.3;"/><text fill="#2C3E50" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="157.1313" x="217" y="243.0161">[generateInvoiceFromBooking()]</text></g><!--link c to DRAFT--><g id="link_c_DRAFT"><path d="M159.99,190.9682 C137.75,192.1682 87.76,198.4082 66,229.6982 C48.18,255.3182 58.6762,287.4823 69.6462,310.0423 " fill="none" id="c-to-DRAFT" style="stroke:#3E5470;stroke-width:1.3;"/><polygon fill="#3E5470" points="72.27,315.4382,71.9316,305.5952,70.0835,310.9417,64.737,309.0936,72.27,315.4382" style="stroke:#3E5470;stroke-width:1.3;"/><text fill="#2C3E50" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="120.4468" x="69" y="243.0161">[createInvoice(), finance]</text></g><!--link DRAFT to SENT--><g id="link_DRAFT_SENT"><path d="M91.82,355.7782 C99.75,372.0882 112.23,395.8382 126,414.6982 C133.05,424.3582 137.5123,429.7627 145.6823,438.3027 " fill="none" id="DRAFT-to-SENT" style="stroke:#3E5470;stroke-width:1.3;"/><polygon fill="#3E5470" points="149.83,442.6382,146.4988,433.3698,146.3736,439.0253,140.7181,438.9001,149.83,442.6382" style="stroke:#3E5470;stroke-width:1.3;"/><text fill="#2C3E50" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="1