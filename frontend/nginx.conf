upstream api {
    server api:6001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads and PDF exports can be large; the default 1m rejects them.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──────────────────────────────────────────────────────────────────
    # The same NestJS route prefixes the Vite dev server proxies, kept in step
    # with API_ROUTES in vite.config.ts. Anything not listed here is treated as
    # a client-side route and falls through to index.html below.
    location ~ ^/(auth|audit|notifications|buildings|floors|spaces|tenants|users|bookings|billing|maintenance|lease-contracts|reports|analytics|addon-services|space-features|price-plans|promotion-codes|booking-applications|tenant-applications|forms|upload|health|search|export|mail|ai|generate-pdf|sites|files|public|webhooks|api)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── notifications websocket ──────────────────────────────────────────────
    # socket.io opens with HTTP polling and upgrades; without the Upgrade
    # headers the handshake succeeds and the upgrade silently fails, leaving
    # live notifications permanently on fallback polling.
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── static assets ────────────────────────────────────────────────────────
    # Vite fingerprints filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── the SPA ──────────────────────────────────────────────────────────────
    # React Router owns every other path; index.html itself must not be cached
    # or a redeploy keeps serving the old asset references.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
